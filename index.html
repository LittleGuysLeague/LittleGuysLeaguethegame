<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Little Guys League</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#15151f;font-family:'Trebuchet MS','Segoe UI',Verdana,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;background:#23233a;touch-action:none;cursor:default}
  #hint{position:fixed;bottom:5px;left:0;right:0;text-align:center;color:#7d7d96;font-size:12px;pointer-events:none;user-select:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="hint">M: som &nbsp;·&nbsp; P: pausa &nbsp;·&nbsp; ESC: menu &nbsp;·&nbsp; P1: WASD + Espaço &nbsp;·&nbsp; P2: Setas + Enter</div>
<script>
"use strict";
(function(){

const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let W=0,H=0,DPR=1,perf=0;
const arenaTexture=new Image();
let arenaPattern=null;
arenaTexture.onload=()=>{
  const tile=document.createElement('canvas');
  tile.width=512;tile.height=384;
  tile.getContext('2d').drawImage(arenaTexture,0,0,tile.width,tile.height);
  arenaPattern=ctx.createPattern(tile,'repeat');
};
arenaTexture.src='AREIA.png';
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize);resize();
function arena(){const m=26;return{x:m,y:m,w:W-2*m,h:H-2*m};}
function cx(){const a=arena();return a.x+a.w/2;}
function cy(){const a=arena();return a.y+a.h/2;}


const V={
  sub:(a,b)=>({x:a.x-b.x,y:a.y-b.y}),
  add:(a,b)=>({x:a.x+b.x,y:a.y+b.y}),
  mul:(a,s)=>({x:a.x*s,y:a.y*s}),
  len:a=>Math.hypot(a.x,a.y),
  norm:a=>{const l=Math.hypot(a.x,a.y)||1;return{x:a.x/l,y:a.y/l};},
  dist:(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),
  dot:(a,b)=>a.x*b.x+a.y*b.y
};
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;const t=a.at(i);a.splice(i,1,a.at(j));a.splice(j,1,t);}return a;}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
const CHARS=new Array(
  {key:'red',   name:'Vermelho',grad:new Array('#FC6376','#FC6376','#F64A5F','#F2354D','#F2354D','#D02F43'),stroke:'#7A1F2A',expr:'none', power:'slap',       speed:188,aggr:1.0 },
  {key:'blue',  name:'Azul',    grad:new Array('#71A3FC','#71A3FC','#5992F5','#4585F0','#4585F0','#3B71D2'),stroke:'#203F86',expr:'none', power:'freeze',     speed:178,aggr:0.6 },
  {key:'yellow',name:'Amarelo', grad:new Array('#F8DC42','#F8DC42','#F6D326','#F5CB10','#F5CB10','#D7B210'),stroke:'#8A710F',expr:'none', power:'dash',       speed:204,aggr:0.7 },
  {key:'pink',  name:'Rosa',    grad:new Array('#F884C1','#F884C1','#F26DB7','#EE5BAE','#EE5BAE','#CE5091'),stroke:'#7A3248',expr:'none', power:'none',      speed:182,aggr:0.5 },
  {key:'purple',name:'Roxo',    grad:new Array('#B27FE6','#B27FE6','#A265DE','#9550D8','#9550D8','#8043B6'),stroke:'#4A2060',expr:'none', power:'telekinesis',speed:176,aggr:0.6 },
  {key:'orange',name:'Laranja', grad:new Array('#FC9432','#FC9432','#F5841B','#F07608','#F07608','#CF6707'),stroke:'#7A4104',expr:'none', power:'dodge',      speed:192,aggr:0.4 },
  {key:'green', name:'Verde',   grad:new Array('#6AE285','#6AE285','#54D570','#42CA5E','#42CA5E','#38AF4E'),stroke:'#1D6B26',expr:'none', power:'none',       speed:186,aggr:0.5 }
);
const POWERS={
  slap:      {name:'Tapa',       cd:3.5},
  freeze:    {name:'Congelar',   cd:6.0},
  dash:      {name:'Dash',       cd:2.6},
  clone:     {name:'Clones',     cd:7.0},
  telekinesis:{name:'Telecinese',cd:6.0},
  dodge:     {name:'Esquiva',    cd:3.0}
};

function charSVG(c){
  const off=new Array(0,'.12','.34','.56','.78',1);
  const stops=c.grad.map((col,i)=>'<stop offset="'+off.at(i)+'" stop-color="'+col+'"/>').join('');
  const gid='g_'+c.key,fid='b_'+c.key;
  const face='<ellipse cx="-17.5" cy="-8" rx="13" ry="16" fill="#fff" stroke="'+c.stroke+'" stroke-width="1.3"/><circle cx="-17.5" cy="-8" r="5.8" fill="#0b0b0b"/>'+
    '<ellipse cx="17.5" cy="-8" rx="13" ry="16" fill="#fff" stroke="'+c.stroke+'" stroke-width="1.3"/><circle cx="17.5" cy="-8" r="5.8" fill="#0b0b0b"/>';
  return '<svg xmlns="http://w3.org" width="240" height="260" viewBox="-60 -58 120 130">'+
    '<defs><radialGradient id="'+gid+'" cx="50%" cy="30%" r="72%">'+stops+'</radialGradient>'+
    '<filter id="'+fid+'" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="1.6"/></filter></defs>'+
    '<ellipse cx="0" cy="57" rx="46" ry="12" fill="#8c7448" opacity=".38" filter="url(#'+fid+')"/>'+
    '<circle r="50" fill="url(#'+gid+')" stroke="'+c.stroke+'" stroke-width="3"/>'+face+'</svg>';
}
const charImg={};
CHARS.forEach(c=>{const im=new Image();im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(charSVG(c));Reflect.set(charImg,c.key,im);});

const Sound={
  muted:true,musicOn:false,
  init(){},blip(){},sweep(){},hit(){},slap(){},freeze(){},dash(){},dodge(){},clone(){},tk(){},score(){},elim(){},bomb(){},win(){},ref(){},ui(){},startMusic(){},stopMusic(){}
};


const parts=new Array(),fx=new Array();
function burst(x,y,col,n,spd,life){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=(0.3+Math.random()*0.7)*spd;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:3+Math.random()*3,col,life,max:life});}}
function ring(x,y,col,r,life){fx.push({type:'ring',x,y,r,col,life,max:life});}
function dust(x,y){burst(x,y,'#d8ccb0',6,50,0.35);}
function ftext(x,y,t,col){fx.push({type:'txt',x,y,t,col,life:0.9,max:0.9});}
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts.at(i);p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.94;p.vy*=0.94;if(p.life<=0)parts.splice(i,1);}
  for(let i=fx.length-1;i>=0;i--){const f=fx.at(i);f.life-=dt;if(f.type==='txt')f.y-=26*dt;if(f.life<=0)fx.splice(i,1);}
}
function drawParts(){for(const p of parts){ctx.save();ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fill();ctx.restore();}}
function drawFx(){for(const f of fx){const k=clamp(f.life/f.max,0,1);ctx.save();ctx.globalAlpha=k;if(f.type==='ring'){ctx.strokeStyle=f.col;ctx.lineWidth=3;ctx.beginPath();ctx.arc(f.x,f.y,f.r*(1.2-k*0.7),0,6.28);ctx.stroke();}else{ctx.font='bold 14px Trebuchet MS';ctx.textAlign='center';ctx.fillStyle=f.col;ctx.fillText(f.t,f.x,f.y);}ctx.restore();}}

const keys={},just={},mouse={x:0,y:0,down:false};
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(!Reflect.get(keys,k))Reflect.set(just,k,true);Reflect.set(keys,k,true);if(k==='m'){Sound.muted=!Sound.muted;if(Sound.muted)Sound.stopMusic();}});
window.addEventListener('keyup',e=>{Reflect.set(keys,e.key.toLowerCase(),false);});
canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;});
canvas.addEventListener('mousedown',e=>{const r=canvas.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;mouse.down=true;});
function moveInput(p){
  let x=0,y=0;
  if(p===1){if(keys.a)x-=1;if(keys.d)x+=1;if(keys.w)y-=1;if(keys.s)y+=1;}
  else{if(keys.arrowleft)x-=1;if(keys.arrowright)x+=1;if(keys.arrowup)y-=1;if(keys.arrowdown)y+=1;}
  return{x,y};
}
class Guy{
  constructor(d){
    this.data=d;this.key=d.key;this.name=d.name;this.img=Reflect.get(charImg,d.key);
    this.r=24;this.x=0;this.y=0;this.vx=0;this.vy=0;
    this.controller='ai';this.alive=true;this.dir={x:1,y:0};
    this.powerList=new Array(d.power);this.powerIdx=0;this.cd=0;
    this.frozen=0;this.boost=null;this.windup=0;this.windDir={x:1,y:0};
    this.clones=new Array();this.input={x:0,y:0};this.score=0;this.elimOrder=0;
    this.crown=false;this.bob=0;this.color=d.grad.at(0);this.stroke=d.stroke;
    this.speed=d.speed;this.aggr=d.aggr;this.spawn={x:0,y:0};this.basePos=null;this.lives=null;
  }
  activePower(){return this.powerList.at(this.powerIdx%this.powerList.length);}
  usePower(){
    if(this.cd>0||!this.alive||this.frozen>0)return false;
    if(game.variation==='nopowers')return false;
    const p=this.activePower();if(p==='none')return false;
    if(game.variation==='everypower')this.powerIdx=(this.powerIdx+1)%this.powerList.length;
    this.cd=Reflect.get(POWERS,p).cd;
    const dir=this.dir;
     switch(p){
      case 'slap':{
        for(const o of game.guys){if(o===this||!o.alive||(this.team&&o.team===this.team))continue;const d=V.dist(this,o);if(d<100){const to=V.norm(V.sub(o,this));if(V.dot(to,dir)>0.25){const kb=520*(1-d/100);o.vx+=to.x*kb;o.vy+=to.y*kb;if(o.carrying)o.carrying=null;}}}
        ring(this.x+dir.x*40,this.y+dir.y*40,'#ff6b7a',46,0.3);Sound.slap();break;}
      case 'freeze':{let best=null,bd=this.team?340:180;for(const o of game.guys){if(o===this||!o.alive||o.frozen>0||(this.team&&o.team===this.team))continue;const d=V.dist(this,o);if(d<bd){bd=d;best=o;}}if(best){best.frozen=2.6;ring(best.x,best.y,'#9fd6ff',50,0.4);burst(best.x,best.y,'#bfe6ff',10,90,0.5);}Sound.freeze();break;}
      case 'dash':{this.boost={time:0.16,mult:2.8,dust:false};this.vx=dir.x*this.speed*2.8;this.vy=dir.y*this.speed*2.8;ring(this.x,this.y,'#ffe680',30,0.2);Sound.dash();break;}
      case 'clone':{for(let i=0;i<2;i++)this.clones.push({x:this.x,y:this.y,life:4,vx:(Math.random()-0.5)*80,vy:(Math.random()-0.5)*80});burst(this.x,this.y,this.color,8,60,0.4);Sound.clone();break;}
      case 'telekinesis':{let tg=game.modality.pullTarget?game.modality.pullTarget(this):null;if(!tg){let bd=this.team?360:260,b=null;for(const o of game.guys){if(o===this||!o.alive||(this.team&&o.team===this.team))continue;const d=V.dist(this,o);if(d<bd){bd=d;b=o;}}tg=b;}if(tg){const to=V.norm(V.sub(tg,this));if(tg.vx!==undefined){tg.vx-=to.x*320;tg.vy-=to.y*320;}else{tg.x-=to.x*30;tg.y-=to.y*30;}ring(this.x,this.y,this.color,60,0.45);ring(tg.x,tg.y,this.color,30,0.4);}Sound.tk();break;}
      case 'dodge':{this.windup=0.14;this.windDir={x:dir.x,y:dir.y};Sound.dodge();break;}
    }
    return true;
  }
  update(dt){

    this.bob+=dt;
    if(this.frozen>0){this.frozen-=dt;this.vx*=0.85;this.vy*=0.85;}
    for(let i=this.clones.length-1;i>=0;i--){const c=this.clones.at(i);c.life-=dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.vx*=0.96;c.vy*=0.96;if(c.life<=0)this.clones.splice(i,1);}
    let ix=this.input.x,iy=this.input.y;const il=Math.hypot(ix,iy);
    if(il>0.01){ix/=il||1;iy/=il||1;if(this.frozen<=0)this.dir={x:ix,y:iy};}
    let sp=this.speed;
    if(this.windup>0){this.windup-=dt;sp*=0.35;if(this.windup<=0){this.boost={time:0.2,mult:1.95,dust:true};this.vx=this.windDir.x*this.speed*1.95;this.vy=this.windDir.y*this.speed*1.95;dust(this.x,this.y);}}
    if(this.boost&&this.boost.time>0){this.boost.time-=dt;sp=this.speed*this.boost.mult;}
    const tvx=ix*sp,tvy=iy*sp;
    const sm=Math.min(1,dt*(this.boost?20:12));
    this.vx+=(tvx-this.vx)*sm;this.vy+=(tvy-this.vy)*sm;
    this.x+=this.vx*dt;this.y+=this.vy*dt;
    const a=arena();
    if(this.x<a.x+this.r){this.x=a.x+this.r;this.vx*=-0.35;}
    if(this.x>a.x+a.w-this.r){this.x=a.x+a.w-this.r;this.vx*=-0.35;}
    if(this.y<a.y+this.r){this.y=a.y+this.r;this.vy*=-0.35;}
    if(this.y>a.y+a.h-this.r){this.y=a.y+a.h-this.r;this.vy*=-0.35;}
    if(this.cd>0)this.cd-=dt;
  }
  draw(){
    for(const c of this.clones){ctx.globalAlpha=0.55*clamp(c.life/4,0,1);drawSprite(this.img,c.x,c.y,this.r*0.65,this.vx,this.vy);}
    ctx.globalAlpha=this.frozen>0?0.92:1;
    drawSprite(this.img,this.x,this.y+Math.sin(this.bob*8)*1.2,(this.clones.length>0?this.r*0.65:this.r),this.vx,this.vy);
    ctx.globalAlpha=1;
    if(this.frozen>0){ctx.save();ctx.fillStyle='rgba(150,210,255,0.42)';ctx.strokeStyle='rgba(200,235,255,0.9)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(this.x,this.y,this.r+4,0,6.28);ctx.fill();ctx.stroke();ctx.restore();}
    if(this.crown)drawCrown(this.x,this.y-this.r-14);
    if(game.modality&&game.modality.showLives&&this.lives!=null){const bx=this.x+this.r*0.62,by=this.y-this.r*0.95;ctx.fillStyle='#e23b3b';ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(bx,by,9,0,6.28);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 11px Trebuchet MS';ctx.textAlign='center';ctx.fillText(this.lives,bx,by+4);}
    if(this.controller!=='ai'){ctx.font='bold 11px Trebuchet MS';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText(this.controller==='human1'?'P1':'P2',this.x,this.y+this.r+12);}
    if(this.activePower()!=='none'&&this.cd>0){const k=1-this.cd/Reflect.get(POWERS,this.activePower()).cd;ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(this.x,this.y,this.r+8,-1.57,-1.57+k*6.28);ctx.stroke();}
    else if(this.activePower()!=='none'&&this.cd<=0){ctx.fillStyle='#fff';ctx.globalAlpha=0.5+0.5*Math.sin(perf*6);ctx.beginPath();ctx.arc(this.x+this.r*0.7,this.y-this.r*0.7,3,0,6.28);ctx.fill();ctx.globalAlpha=1;}
  }
}
function drawSprite(c,x,y,r,vx=0,vy=0){if(!c||!c.grad){c=CHARS.find(x=>Reflect.get(charImg,x.key)===c)||CHARS.at(0);}
  const s=r/50;
  ctx.save();ctx.globalAlpha=0.38;ctx.fillStyle='#8c7448';
  ctx.beginPath();ctx.ellipse(x,y+57*s,46*s,12*s,0,0,6.28);ctx.fill();ctx.restore();
  const gd=ctx.createRadialGradient(x,y-16*s,3*s,x,y,60*s);
  const off=new Array(0,.12,.34,.56,.78,1);
  for(let i=0;i<6;i++)gd.addColorStop(off.at(i),c.grad.at(i));
  ctx.fillStyle=gd;ctx.strokeStyle=c.stroke;ctx.lineWidth=3*s;
  ctx.beginPath();ctx.arc(x,y,50*s,0,6.28);ctx.fill();ctx.stroke();
  const lx=x-17.5*s,rxp=x+17.5*s,ey=y-8*s,erx=13*s,ery=16*s,pr=5.8*s;
  const spd=Math.hypot(vx,vy);
  const ox=spd>15?(vx/spd)*4.5*s:0;
  const oy=spd>15?(vy/spd)*5.5*s:0;
  for(const ex of new Array(lx,rxp)){
    ctx.fillStyle='#fff';ctx.strokeStyle=c.stroke;ctx.lineWidth=1.3*s;
    ctx.beginPath();ctx.ellipse(ex,ey,erx,ery,0,0,6.28);ctx.fill();ctx.stroke();
    ctx.fillStyle='#0b0b0b';ctx.beginPath();ctx.arc(ex+ox,ey+oy,pr,0,6.28);ctx.fill();
  }
}
function drawCrown(x,y){ctx.save();ctx.translate(x,y+Math.sin(perf*4)*1.5);ctx.fillStyle='#FFD23F';ctx.strokeStyle='#B8860B';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(-11,4);ctx.lineTo(-11,-3);ctx.lineTo(-6,2);ctx.lineTo(-2,-6);ctx.lineTo(0,1);ctx.lineTo(2,-6);ctx.lineTo(6,2);ctx.lineTo(11,-3);ctx.lineTo(11,4);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}
function resolveCollisions(list){
  for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
    const a=list.at(i),b=list.at(j);if(!a.alive||!b.alive)continue;
    const dx=b.x-a.x,dy=b.y-a.y;let d=Math.hypot(dx,dy);const mn=a.r+b.r;
    if(d<mn&&d>0.001){
      const nx=dx/d,ny=dy/d,ov=mn-d;
      const am=(a.frozen>0?0:1),bm=(b.frozen>0?0:1),tot=am+bm||1;
      a.x-=nx*ov*(am/tot);a.y-=ny*ov*(am/tot);
      b.x+=nx*ov*(bm/tot);b.y+=ny*ov*(bm/tot);
      const rvx=b.vx-a.vx,rvy=b.vy-a.vy,vn=rvx*nx+rvy*ny;
      if(vn<0){const imp=-vn*0.55;a.vx-=imp*nx*am;a.vy-=imp*ny*am;b.vx+=imp*nx*bm;b.vy+=imp*ny*bm;Sound.hit();}
    } else if(d<=0.001){a.x+=0.2;b.x-=0.2;}
  }
}

function spawnAround(mx,my,R,n){const a=new Array();for(let i=0;i<n;i++){const ang=i/n*6.283;a.push({x:mx+Math.cos(ang)*R,y:my+Math.sin(ang)*R});}return a;}
function steerTo(g,tx,ty,slow){const dx=tx-g.x,dy=ty-g.y,d=Math.hypot(dx,dy);if(d<14)return{x:0,y:0};let nx=dx/d,ny=dy/d;const lim=slow||36;if(d<lim){nx*=d/lim;ny*=d/lim;}return{x:nx,y:ny};}

function steerFrom(g,tx,ty){const dx=g.x-tx,dy=g.y-ty,d=Math.hypot(dx,dy)||1;return{x:dx/d,y:dy/d};}
function edgeAvoid(g){const a=arena();let x=0,y=0,pad=64;if(g.x<a.x+pad)x=1-(g.x-a.x)/pad;if(g.x>a.x+a.w-pad)x=-((a.x+a.w-g.x)/pad);if(g.y<a.y+pad)y=1-(g.y-a.y)/pad;if(g.y>a.y+a.h-pad)y=-((a.y+a.h-g.y)/pad);return{x,y};}
function nearestOther(g,pred){let best=null,bd=1e9;for(const o of game.guys){if(o===g||!o.alive)continue;if(pred&&!pred(o))continue;const d=V.dist(g,o);if(d<bd){bd=d;best=o;}}return best;}
function aiPower(g,want){return want&&g.cd<=0&&g.activePower()!=='none'&&game.variation!=='nopowers';}

class Mod{
  constructor(){this.name='';this.rules='';this.music='game';}
  start(){}
  update(dt){}
  draw(c){}
  drawHUD(c){}
  aiThink(g){return{x:0,y:0,power:false};}
  pullTarget(g){return nearestOther(g);}
  isOver(){return false;}
  placements(){return new Array(...game.guys).sort((a,b)=>b.score-a.score);}
}

class ConeGame extends Mod{constructor(){super();this.name='Jogo dos Cones';this.rules='Leve 3 cones ao seu círculo. Roubo permitido!';}
  start(){const a=arena();const mx=cx(),my=cy();const br=Math.min(a.w,a.h)/2-54;const mains=game.guys.filter(g=>!g.isClone);mains.forEach((g,i)=>{const ang=i/7*6.283;g.basePos={x:mx+Math.cos(ang)*br,y:my+Math.sin(ang)*br};g.baseCount=0;});
    game.cones=new Array();for(let i=0;i<5;i++){let p;let ok=false,t=0;do{p={x:mx+(Math.random()-0.5)*a.w*0.4,y:my+(Math.random()-0.5)*a.h*0.4};ok=true;for(const g of mains)if(V.dist(p,g.basePos)<70)ok=false;t++;}while(!ok&&t<40);p.vx=0;p.vy=0;p.carriedBy=null;game.cones.push(p);}}
  update(dt){for(const c of game.cones){if(c.carriedBy){c.x=c.carriedBy.x;c.y=c.carriedBy.y-c.carriedBy.r-8;c.vx=0;c.vy=0;}else{c.vx*=0.9;c.vy*=0.9;c.x+=c.vx*dt;c.y+=c.vy*dt;const a=arena();c.x=clamp(c.x,a.x+10,a.x+a.w-10);c.y=clamp(c.y,a.y+10,a.y+a.h-10);}}
    for(const g of game.guys){if(!g.alive)continue;const main=game.guys.find(x=>x.key===g.key&&!x.isClone)||g;if(!main.basePos)continue;
      if(g.carrying){const b=main.basePos;if(V.dist(g,b)<44){main.baseCount++;g.carrying=null;const ci=game.cones.indexOf(g._cone);if(ci>=0)game.cones.splice(ci,1);ftext(b.x,b.y-30,'+1','#fff');Sound.score();burst(b.x,b.y,g.color,10,80,0.4);continue;}}
      else{for(const o of game.guys){if(o.isClone||o.key===g.key||!o.alive||o.baseCount<=0||!o.basePos)continue;if(V.dist(g,o.basePos)<44){g.carrying={cone:true};g._cone={x:g.x,y:g.y-g.r-8,carriedBy:g,vx:0,vy:0};game.cones.push(g._cone);o.baseCount--;ftext(o.basePos.x,o.basePos.y-26,'Roubado!','#ffb');break;}}
        if(!g.carrying){for(const c of game.cones){if(!c.carriedBy&&V.dist(g,c)<g.r+14){c.carriedBy=g;g.carrying=c;g._cone=c;break;}}}}}}
  draw(c){for(const g of game.guys){if(g.isClone||!g.basePos)continue;c.save();c.beginPath();c.arc(g.basePos.x,g.basePos.y,34,0,6.28);c.strokeStyle=g.stroke;c.lineWidth=3;c.fillStyle=g.color;c.globalAlpha=0.25;c.fill();c.globalAlpha=1;c.stroke();c.font='bold 16px Trebuchet MS';c.textAlign='center';c.fillStyle='#fff';c.fillText((g.baseCount||0)+'/3',g.basePos.x,g.basePos.y+5);c.restore();}
    for(const cone of game.cones){drawCone(c,cone.x,cone.y);}}
  drawHUD(c){const lead=this.placements().at(0);c.font='bold 16px Trebuchet MS';c.textAlign='left';c.fillStyle='#fff';c.fillText('Lider: '+lead.name+' '+(lead.baseCount||0)+'/3',30,40);}
  aiThink(g){const main=game.guys.find(x=>x.key===g.key&&!x.isClone)||g;if(!main.basePos)return{x:0,y:0,power:false};let mv;let tgt=null,bd=1e9;if(g.carrying){mv=steerTo(g,main.basePos.x,main.basePos.y);}else{for(const c of game.cones){if(c.carriedBy)continue;const d=V.dist(g,c);if(d<bd){bd=d;tgt=c;}}let stealT=null,sd=1e9;for(const o of game.guys){if(o.isClone||o.key===g.key||!o.alive||o.baseCount<=0||!o.basePos)continue;const d=V.dist(g,o.basePos);if(d<sd){sd=d;stealT=o.basePos;}}if(tgt&&(!stealT||bd<sd+40))mv=steerTo(g,tgt.x,tgt.y);else if(stealT)mv=steerTo(g,stealT.x,stealT.y);else mv={x:0,y:0};}const ev=edgeAvoid(g);const opp=nearestOther(g);return{x:mv.x+ev.x*0.5,y:mv.y+ev.y*0.5,power:aiPower(g,opp&&V.dist(g,opp)<70&&g.aggr>0.5)||aiPower(g,!!tgt&&bd<160&&g.activePower()==='telekinesis')};}
  pullTarget(g){let tgt=null,bd=260;for(const c of game.cones){if(c.carriedBy)continue;const d=V.dist(g,c);if(d<bd){bd=d;tgt=c;}}return tgt;}
  isOver(){return game.guys.some(g=>!g.isClone&&(g.baseCount||0)>=3);}

class Chairs extends Mod{constructor(){super();this.name='Dança das Cadeiras';this.rules='Ande enquanto a música toca. Sente quando parar. Sem cadeira = eliminado.';this.music='chairs';}

class Dodgeball extends Mod{constructor(){super();this.name='Queimada';this.rules='2 times! Não cruze o meio, não pise fora e acerte o time oposto!';this.showLives=true;}
  court(){const a=arena();const pad=34;return{x:a.x+pad,y:a.y+pad,w:a.w-pad*2,h:a.h-pad*2};}
   start(){
    const q=this.court();game.balls=new Array();
    const pink=game.guys.find(g=>g.key==='pink');
    const others=game.guys.filter(g=>g.key!=='pink');
    const pinkLeft=Math.random()<0.5;
    const teamL=pinkLeft?(pink?new Array(pink,...others.slice(0,2)):others.slice(0,3)):others.slice(0,4);
    const teamR=pinkLeft?others.slice(2):(pink?new Array(pink,...others.slice(4)):others.slice(4));
    teamL.forEach((g,idx)=>{g.lives=2;g.invuln=0;g.team='L';g._aimT=0;g._dodgeDir=idx%2?1:-1;g.x=q.x+q.w*0.22;g.y=q.y+(idx+1)*q.h/(teamL.length+1);});
    teamR.forEach((g,idx)=>{g.lives=2;g.invuln=0;g.team='R';g._aimT=0;g._dodgeDir=idx%2?1:-1;g.x=q.x+q.w*0.78;g.y=q.y+(idx+1)*q.h/(teamR.length+1);});
    game.balls.push({x:cx(),y:cy(),vx:0,vy:0,r:14,holder:null,thrownBy:null,protect:0,hot:false});
  }
  enemy(g){return nearestOther(g,o=>o.team!==g.team);}
  update(dt){
    const q=this.court();
    for(const g of game.guys){
      if(!g.alive)continue;
      if(g.invuln>0)g.invuln-=dt;
      if(g.team==='L'&&g.x>cx()-g.r){g.x=cx()-g.r;if(g.vx>0)g.vx=0;}
      if(g.team==='R'&&g.x<cx()+g.r){g.x=cx()+g.r;if(g.vx<0)g.vx=0;}
      if(g.x<q.x||g.x>q.x+q.w||g.y<q.y||g.y>q.y+q.h){ftext(g.x,g.y-20,'Saiu!','#ff5a3c');eliminate(g);}
    }

    for(const b of game.balls){if(b.protect>0)b.protect-=dt;if(b.holder){if(!b.holder.alive){b.holder=null;b.hot=false;continue;}b.x=b.holder.x;b.y=b.holder.y-b.holder.r-6;b.vx=0;b.vy=0;b.hot=false;continue;}
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=0.982;b.vy*=0.982;
    const spd=Math.hypot(b.vx,b.vy);if(spd<260)b.hot=false;if(b.x<q.x+b.r){b.x=q.x+b.r;b.vx*=-0.75;}if(b.x>q.x+q.w-b.r){b.x=q.x+q.w-b.r;b.vx*=-0.75;}if(b.y<q.y+b.r){b.y=q.y+b.r;b.vy*=-0.75;}if(b.y>q.y+q.h-b.r){b.y=q.y+q.h-b.r;b.vy*=-0.75;}
if(b.x<q.x+b.r){b.x=q.x+b.r;b.vx*=-0.75;}if(b.x>q.x+q.w-b.r){b.x=q.x+q.w-b.r;b.vx*=-0.75;}if(b.y<q.y+b.r){b.y=q.y+b.r;b.vy*=-0.75;}if(b.y>q.y+q.h-b.r){b.y=q.y+q.h-b.r;b.vy*=-0.75;}
    if(b.hot){for(const g of game.guys){if(!g.alive||g.invuln>0||(b.thrownBy&&g.team===b.thrownBy.team))continue;if(V.dist(g,b)<g.r+b.r){g.lives--;g.invuln=0.9;b.hot=false;b.vx*=-0.15;b.vy*=-0.15;b.thrownBy=null;if(g.lives<=0)eliminate(g);else{ftext(g.x,g.y-24,'-1 Vida!','#e23b3b');burst(g.x,g.y,'#e23b3b',8,80,0.4);}burst(b.x,b.y,'#fff',8,100,0.4);break;}}}
    if(!b.hot&&spd<220){for(const g of game.guys){if(!g.alive||g.invuln>0)continue;if(V.dist(g,b)<g.r+b.r+6){b.holder=g;g._aimT=0.3+Math.random()*0.35;b.vx=0;b.vy=0;break;}}}}}
  draw(c){
    const q=this.court();
    c.save();
    c.fillStyle='rgba(255,255,255,0.04)';c.fillRect(q.x,q.y,q.w,q.h);
    c.strokeStyle='rgba(255,255,255,0.8)';c.lineWidth=3;c.strokeRect(q.x,q.y,q.w,q.h);
    c.beginPath();c.moveTo(cx(),q.y);c.lineTo(cx(),q.y+q.h);c.stroke();

  }

  drawHUD(c){
    const l=game.guys.filter(g=>g.alive&&g.team==='L').length,r=game.guys.filter(g=>g.alive&&g.team==='R').length;
    c.font='bold 16px Trebuchet MS';c.textAlign='left';c.fillStyle='#93c5fd';c.fillText('Time Esq: '+l+'  |  ',30,40);
    c.fillStyle='#fca5a5';c.fillText('Time Dir: '+r,155,40);
  }  throwBall(g){

    const d=Math.hypot(dx,dy)||1;b.holder=null;b.thrownBy=g;b.protect=0.25;b.hot=true;b.vx=dx/d*840;b.vy=dy/d*840;Sound.slap();
  }
  aiThink(g,dt){
    const q=this.court();let kx=0,ky=0,pad=36;
    if(g.x<q.x+pad)kx=1.4;if(g.x>q.x+q.w-pad)kx=-1.4;if(g.y<q.y+pad)ky=1.4;if(g.y>q.y+q.h-pad)ky=-1.4;
    const b=game.balls.at(0);
    if(b&&b.holder===g){
      g._aimT=(g._aimT||0)-0.02;
      const o=this.enemy(g);
      const lineX=g.team==='L'?cx()-38:cx()+38;
      if(Math.abs(g.x-lineX)>28){
        const mv=steerTo(g,lineX,o?o.y:cy());
        return{x:mv.x+kx,y:mv.y+ky,power:false};
      }
      const aim=o?steerTo(g,o.x,o.y):{x:g.team==='L'?1:-1,y:0};
      const aligned=o&&V.dot(g.dir,aim)>0.92;
      return{x:aim.x*0.35,y:aim.y*0.35,power:aligned&&g._aimT<=0};
    }

    if(b&&!b.holder&&!b.hot&&((g.team==='L'&&b.x<=cx()+20)||(g.team==='R'&&b.x>=cx()-20))){
      const mv=steerTo(g,b.x,b.y);return{x:mv.x+kx,y:mv.y+ky,power:false};
    }
    if(b&&b.hot&&b.thrownBy&&b.thrownBy.team!==g.team){
      const to=V.sub(g,b);const dl=V.len(to);
      if(dl<165&&Math.random()<0.65){
        const perp={x:-b.vy,y:b.vx};const pn=V.norm(perp);
        const side=V.dot(to,pn)>=0?1:-1;
        return{x:pn.x*side+kx,y:pn.y*side+ky,power:aiPower(g,dl<130&&g.activePower()==='dodge')};
      }
    }
    if(b&&b.holder&&b.holder.team!==g.team){
      if(Math.random()<0.03)g._dodgeDir=-(g._dodgeDir||1);
      const backX=g.team==='L'?q.x+q.w*0.18:q.x+q.w*0.82;
      const strafeY=clamp(g.y+(g._dodgeDir||1)*80,q.y+50,q.y+q.h-50);
      const mv=steerTo(g,backX,strafeY,35);
      return{x:mv.x+kx,y:mv.y+ky,power:false};
    }
    const midX=g.team==='L'?q.x+q.w*0.28:q.x+q.w*0.72;
    const laneY=q.y+((game.guys.indexOf(g)%4)+1)*(q.h/5);
    const mv=steerTo(g,midX,laneY,25);
    return{x:mv.x+kx,y:mv.y+ky,power:false};
  }
  pullTarget(g){return this.enemy(g);}
  isOver(){const l=game.guys.filter(g=>g.alive&&g.team==='L').length,r=game.guys.filter(g=>g.alive&&g.team==='R').length;return l===0||r===0;}
  placements(){return elimPlacements();}
  onThrow(g){this.throwBall(g);}}



class RedLight extends Mod{constructor(){super();this.name='Batatinha Frita 1-2-3';this.rules='Avance no verde. Pare no vermelho. Quem se mexer no vermelho é eliminado.';}
  start(){const a=arena();this.finishY=a.y+30;this.state='green';this.st=2.5+Math.random()*2;game.guys.forEach((g,i)=>{g.x=a.x+50+(i+0.5)*(a.w-100)/7;g.y=a.y+a.h-40;g.dir={x:0,y:-1};});}
  update(dt){this.st-=dt;if(this.st<=0){if(this.state==='green'){this.state='red';this.st=1.4+Math.random()*1.4;this.grace=0.25;referee('PAROU!',1.6);Sound.stopMusic();}else{this.state='green';this.st=2.2+Math.random()*2;referee('1, 2, 3!',1.4);Sound.startMusic();}}
    if(this.state==='red'){if(this.grace>0)this.grace-=dt;else{for(const g of game.guys){if(!g.alive)continue;if((g._inMag||0)>0.1){eliminate(g);ftext(g.x,g.y-20,'Pego!','#ff5a3c');}}}}
    for(const g of game.guys){if(g.alive&&g.y<=this.finishY){this.winner=g;this.done=true;Sound.win();}}}
  draw(c){c.save();c.strokeStyle='#7CFC8A';c.lineWidth=4;c.setLineDash(new Array(12,8));c.beginPath();c.moveTo(arena().x,this.finishY-6);c.lineTo(arena().x+arena().w,this.finishY-6);c.stroke();c.setLineDash(new Array());c.restore();}
  drawHUD(c){c.save();const fl=this.state==='green';c.fillStyle=fl?'#3CFF6A':'#FF3A3A';c.font='bold 26px Trebuchet MS';c.textAlign='center';c.fillText(fl?'VERDE — AVANCE!':'VERMELHO — PARE!',cx(),54);c.restore();}
  aiThink(g){if(this.state==='red')return{x:0,y:0,power:false};return{x:0,y:-1,power:aiPower(g,g.activePower()==='dash'&&Math.random()<0.01)};}
  isOver(){return this.done||new Set(game.guys.filter(g=>g.alive).map(g=>g.key)).size<=1;}
  placements(){if(this.winner){const gs=new Array(...game.guys).sort((a,b)=>(a===this.winner?-1:b===this.winner?1:b.y-a.y));return gs;}return elimPlacements();}}

function banner(t,d){game.banner={t,d:d||2.5,dur:d||2.5};}

function createModality(i){const M=MODS.at(i);return new M();}

function startMatch(){
  game.guys=new Array();parts.length=0;fx.length=0;game.elimCount=0;game.elapsed=0;game.countdown=3.4;game.buttons=new Array();
  game.season=game.season||{};game.seasonWins=game.seasonWins||{};
  const pool=shuffle(new Array(...CHARS));
  const used=new Array();
  const c1=game.mode>=1?(game.p1Char?CHARS.find(c=>c.key===game.p1Char):pool.find(c=>!used.includes(c.key))):null;
  if(c1)used.push(c1.key);
  const c2=game.mode===2?(game.p2Char&&game.p2Char!==c1.key?CHARS.find(c=>c.key===game.p2Char):pool.find(c=>!used.includes(c.key))):null;
  if(c2)used.push(c2.key);
  for(let i=0;i<7;i++){const d=pool.at(i);const g=new Guy(d);g.controller=(c1&&d.key===c1.key)?'human1':(c2&&d.key===c2.key)?'human2':'ai';g.team=null;game.guys.push(g);if(!Reflect.has(game.season,d.key))Reflect.set(game.season,d.key,0);}
  const a=arena();const pos=spawnAround(cx(),cy(),Math.min(a.w,a.h)*0.32,7);
  game.guys.forEach((g,i)=>{const p=pos.at(i);g.x=p.x;g.y=p.y;g.dir={x:Math.cos(i),y:Math.sin(i)};g.spawn={x:p.x,y:p.y};});
  game.modality=createModality(game.modalityIdx);
  game.cones=new Array();game.balls=new Array();game.chairs=new Array();
  game.modality.start();  const pink=game.guys.find(g=>g.key==='pink');
  if(pink){pink.r=16;const twin=new Guy(pink.data);twin.x=pink.x+20;twin.y=pink.y;twin.r=16;twin.isClone=true;twin.controller='ai';twin.team=pink.team;twin.lives=pink.lives;twin.invuln=0;game.guys.push(twin);}

  game.state='playing';game.paused=false;
  referee(game.modality.name+' — '+game.modality.rules,3.2);
  if(game.modality.music!=='chairs')Sound.startMusic();
}

function endMatch(){game.guys=game.guys.filter(g=>!g.isClone);game.state='result';game.buttons=new Array();const pl=game.modality.placements();const pts=new Array(12,9,7,5,3,2,1);game.lastPlaces=pl;game.lastPoints={};pl.forEach((g,i)=>{const p=pts.at(Math.min(i,6))||1;Reflect.set(game.lastPoints,g.key,p);Reflect.set(game.season,g.key,(Reflect.get(game.season,g.key)||0)+p);if(i===0)Reflect.set(game.seasonWins,g.key,(Reflect.get(game.seasonWins,g.key)||0)+1);});Sound.win();Sound.stopMusic();}
function updateCrown(){for(const g of game.guys)g.crown=false;let best=null,bv=-1;for(const g of game.guys){if(!g.alive)continue;const v=(Reflect.get(game.season,g.key)||0)+g.score*0.01;if(v>bv){bv=v;best=g;}}if(best&&bv>0)best.crown=true;}

function updateGame(dt){
  if(game.paused)return;
  if(game.countdown>0){game.countdown-=dt;updateParts(dt);return;}
  game.elapsed+=dt;
  for(const g of game.guys){if(!g.alive)continue;let inp,pow=false;
    if(g.controller==='human1'){inp=moveInput(1);pow=Reflect.get(just,' ');}
    else if(g.controller==='human2'){inp=moveInput(2);pow=Reflect.get(just,'enter');}
    else{const a=game.modality.aiThink(g,dt);inp={x:a.x,y:a.y};pow=a.power;}
    g.input=inp;g._inMag=Math.hypot(inp.x,inp.y);
    if(pow){
      if(game.modality.onThrow&&game.balls&&game.balls.some(b=>b.holder===g))game.modality.onThrow(g);
      else g.usePower();
    }
  }
  for(const g of game.guys)if(g.alive)g.update(dt);
  resolveCollisions(game.guys);
  game.modality.update(dt);
  updateParts(dt);
  updateCrown();
  if(game.banner){game.banner.d-=dt;if(game.banner.d<=0)game.banner=null;}
  if(game.modality.isOver())endMatch();
}

  ctx.fillStyle='#9a9ab0';ctx.textAlign='center';ctx.font='12px Trebuchet MS';ctx.fillText('Classificação da Liga (coroa no líder):',cx(),y+130+pl.length*26+10);
  st.forEach((g,i)=>{const ry=y+130+pl.length*26+30+i*20;ctx.textAlign='left';ctx.fillStyle=i===0?'#ffd23f':'#aaa';ctx.font='13px Trebuchet MS';ctx.fillText((i+1)+'. '+g.name+'  '+(Reflect.get(game.season,g.key)||0)+' pts',x+24,ry);if(i===0)drawCrown(x+12,ry-4);});
  game.buttons=new Array({x:cx()-180-8,y:y+Math.min(560,H-80)-60,w:170,h:46,l:'Revanche',act:()=>{Sound.ui();startMatch();}},{x:cx()+8,y:y+Math.min(560,H-80)-60,w:170,h:46,l:'Menu',act:()=>{Sound.ui();game.state='title';}});
  drawBtns(game.buttons);
}

function drawHeader(t){ctx.fillStyle='#15151f';ctx.fillRect(0,0,W,80);ctx.fillStyle='#ffd23f';ctx.font='bold 28px Trebuchet MS';ctx.textAlign='center';ctx.fillText(t,cx(),48);}
function layoutBtns(labels,sx,sy,w,h){const gap=14;return labels.map((l,i)=>({x:sx-w/2,y:sy+i*(h+gap),w,h,l:l}));}
function hit(b){return mouse.x>=b.x&&mouse.x<=b.x+b.w&&mouse.y>=b.y&&mouse.y<=b.y+b.h;}
function drawBtn(b,hov){ctx.save();rr(ctx,b.x,b.y,b.w,b.h,12);ctx.fillStyle=hov?(b.back?'rgba(255,255,255,0.12)':'rgba(255,210,63,0.22)'):'rgba(255,255,255,0.06)';ctx.fill();ctx.strokeStyle=hov?'#ffd23f':'rgba(255,255,255,0.25)';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle=hov?'#ffd23f':'#fff';ctx.font='bold 18px Trebuchet MS';ctx.textAlign='center';ctx.fillText(b.l,b.x+b.w/2,b.y+b.h/2+6);ctx.restore();}
function drawBtns(bs,withDesc){for(const b of bs){const hov=hit(b);if(withDesc&&b.d!==undefined){ctx.save();rr(ctx,b.x,b.y,b.w,b.h,12);ctx.fillStyle=hov?'rgba(255,210,63,0.18)':'rgba(255,255,255,0.05)';ctx.fill();ctx.strokeStyle=hov?'#ffd23f':'rgba(255,255,255,0.2)';ctx.lineWidth=2;ctx.stroke();ctx.textAlign='center';ctx.fillStyle=hov?'#ffd23f':'#fff';ctx.font='bold 18px Trebuchet MS';ctx.fillText(b.l,b.x+b.w/2,b.y+24);ctx.fillStyle='#9a9ab0';ctx.font='12px Trebuchet MS';if(b.d)ctx.fillText(b.d,b.x+b.w/2,b.y+44);ctx.restore();}else drawBtn(b,hov);}}

let last=performance.now();
function loop(now){perf=now/1000;let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;
  if(game.state==='playing')updateGame(dt);
  else if(game.banner){game.banner.d-=dt;if(game.banner.d<=0)game.banner=null;}
  if(mouse.down){mouse.down=false;Sound.init();handleClick();}
  render();
  if(Reflect.get(just,'escape')){if(game.state==='playing'){game.state='title';Sound.stopMusic();}else if(game.state!=='title'){game.state='title';}}
  if(Reflect.get(just,'p')&&game.state==='playing'){game.paused=!game.paused;Sound.ui();}
  for(const k in just)Reflect.set(just,k,false);
  requestAnimationFrame(loop);
}
function handleClick(){
  if(game.state==='playing'&&!game.paused)return;
  for(const b of game.buttons||new Array()){if(hit(b)){b.act&&b.act();return;}}
}

requestAnimationFrame(loop);

})();
</script>
